name: Windows shutdown diagnosis
# Diagnosis branches only (#10): repeated exits of one fixture, every outcome
# retained. Not a gate and never a retry of a CI check.
on:
  push:
    branches: ['codex/shutdown-diag*']
permissions:
  contents: read
jobs:
  diagnose:
    name: Exit after loading '${{ matrix.load }}'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        load: ['', 'res://scripts/networking/mvp_session.gd', 'res://tests/practice/practice_session_test.gd']
    env:
      BATTLEBOTS_DIAG_LOAD: ${{ matrix.load }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Repeat the practice session exit
        shell: pwsh
        run: ./tools/diagnose-shutdown.ps1 -GodotPath $env:GODOT -Fixture load -Trials 50
      - name: Record native Godot failures
        if: always()
        shell: pwsh
        run: ./tools/record-native-failures.ps1
