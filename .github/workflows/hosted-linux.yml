name: Linux hosted duel runtime
on:
  push:
    branches: [main, 'codex/a-*']
    paths:
      - 'battlebots/**'
      - 'services/matchmaking/**'
      - 'tools/check-hosted.mjs'
      - 'tools/prepare-hosted.ps1'
      - 'tools/prepare-hosted.mjs'
      - '.dockerignore'
      - '.github/workflows/hosted-linux.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install checksum-verified pinned Linux Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          mkdir -p "$RUNNER_TEMP/godot-download" "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot-download"
          curl --fail --silent --show-error --location "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          for asset in Godot_v4.7.2-stable_linux.x86_64.zip Godot_v4.7.2-stable_export_templates.tpz; do
            curl --fail --silent --show-error --location "$release/$asset" -o "$asset"
            awk -v wanted="$asset" '$2 == wanted {print}' SHA512-SUMS.txt | sha512sum --check --strict
          done
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d "$RUNNER_TEMP/godot"
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Prepare matching client/server release and compatibility manifest
        run: node tools/prepare-hosted.mjs --godot "$GODOT"
      - name: Build and start production image as its default unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          docker build --file services/matchmaking/Dockerfile --tag battlebots-hosted:ci .
          test "$(docker image inspect battlebots-hosted:ci --format '{{.Config.User}}')" = node
          docker run --detach --name battlebots-hosted-ci --network host \
            --env PUBLIC_ADDRESS=127.0.0.1 --env BIND_ADDRESS=0.0.0.0 \
            --env PORT=18080 --env REGION=linux-ci battlebots-hosted:ci
      - name: Verify real allocated UDP duel through results and rematch
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node tools/check-hosted.mjs --godot "$GODOT" --local-service http://127.0.0.1:18080
      - name: Collect container logs and stop only this job's container
        if: always()
        shell: bash
        run: |
          if docker container inspect battlebots-hosted-ci > /dev/null 2>&1; then
            docker logs battlebots-hosted-ci > "$RUNNER_TEMP/battlebots-linux-container.log" 2>&1
            docker rm --force battlebots-hosted-ci
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battlebots-linux-hosted-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/battlebots-linux-container.log
            ${{ runner.temp }}/battlebots-hosted-*/report.json
            ${{ runner.temp }}/battlebots-hosted-*/*.out.log
            ${{ runner.temp }}/battlebots-hosted-*/*.err.log
            battlebots/exports/hosted-server/build-record.json
            battlebots/exports/hosted-server/manifest.json
