name: Godot MVP checks and builds
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
# A newer push to a task branch supersedes its running checks; main keeps every run.
concurrency:
  group: mvp-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# The suite runs as parallel jobs so every failure is reported in one run and a
# failure in one area never hides the others. No check is skipped or relaxed.
jobs:
  simulation:
    name: Baseline, rules, physics and transport
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check native-crash validation gates
        shell: pwsh
        run: |
          ./tools/tests/check-drive-gate.ps1
          ./tools/tests/diagnose-shutdown-test.ps1
      - uses: ./.github/actions/setup-godot
      - name: Validate baseline, rules, physics and profile-independent transport
        shell: pwsh
        run: ./tools/check-mvp.ps1 -GodotPath $env:GODOT -Part sim
      - name: Record native Godot failures
        if: failure()
        shell: pwsh
        run: ./tools/record-native-failures.ps1

  network:
    name: Impaired networking (${{ matrix.profile }} ms)
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: ['0', '80', '150']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Validate four-peer networking under the ${{ matrix.profile }} ms profile
        shell: pwsh
        run: ./tools/check-mvp.ps1 -GodotPath $env:GODOT -Part net -NetProfiles ${{ matrix.profile }}
      - name: Record native Godot failures
        if: failure()
        shell: pwsh
        run: ./tools/record-native-failures.ps1

  presentation:
    name: Presentation and menu integration
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Check presentation and menu integration
        shell: pwsh
        run: ./battlebots/tests/presentation/check-presentation.ps1 -GodotPath $env:GODOT
      - name: Record native Godot failures
        if: failure()
        shell: pwsh
        run: ./tools/record-native-failures.ps1

  gameplay:
    name: Natural duel and hosted matchmaking
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check natural two-player combat and rematch
        shell: pwsh
        run: ./tools/check-gameplay.ps1 -GodotPath $env:GODOT
      - name: Check hosted matchmaking and assigned dedicated gameplay
        shell: pwsh
        run: |
          node --test services/matchmaking/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Matchmaking service tests failed' }
          # The shipped client only queues for duels (Quick Play capacity 2).
          node tools/check-hosted.mjs --godot $env:GODOT --duel-only
          if ($LASTEXITCODE -ne 0) { throw 'Hosted end-to-end test failed' }
      - name: Record native Godot failures
        if: failure()
        shell: pwsh
        run: ./tools/record-native-failures.ps1

  export:
    name: Export and independent processes
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          export-templates: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Export client and server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force battlebots/exports/windows,battlebots/exports/linux | Out-Null
          & $env:GODOT --headless --path battlebots --export-release 'Windows Client'
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed' }
          & $env:GODOT --headless --path battlebots --export-release 'Linux Server'
          if ($LASTEXITCODE -ne 0) { throw 'Linux export failed' }
      - name: Check independent server and client processes
        shell: pwsh
        run: |
          $client = (Resolve-Path ./battlebots/exports/windows/battlebots.exe).Path
          # The shipped 1v1, and the deferred ten-player lobby once (#24).
          ./tools/check-processes.ps1 -GodotPath $client -PlayerCount 2 -Exported
          ./tools/check-processes.ps1 -GodotPath $client -PlayerCount 10 -Exported
          node tools/check-hosted.mjs --godot $env:GODOT --server-binary $client --duel-only
          if ($LASTEXITCODE -ne 0) { throw 'Exported hosted-server test failed' }
      - name: Record native Godot failures
        if: failure()
        shell: pwsh
        run: ./tools/record-native-failures.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: battlebots-mvp-${{ github.sha }}
          path: battlebots/exports/
