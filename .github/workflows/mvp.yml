name: Godot MVP checks and builds
on:
  push:
    branches: [main, 'codex/a-*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and export templates
        shell: pwsh
        run: |
          $release = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          Invoke-WebRequest "$release/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Invoke-WebRequest "$release/Godot_v4.7.2-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          Invoke-WebRequest "$release/SHA512-SUMS.txt" -OutFile "$env:RUNNER_TEMP/sums.txt"
          foreach ($pair in @(@('godot.zip','Godot_v4.7.2-stable_win64.exe.zip'), @('templates.zip','Godot_v4.7.2-stable_export_templates.tpz'))) {
            $actual = (Get-FileHash "$env:RUNNER_TEMP/$($pair[0])" -Algorithm SHA512).Hash.ToLower()
            $line = Get-Content "$env:RUNNER_TEMP/sums.txt" | Where-Object { $_.EndsWith($pair[1]) }
            if (-not $line -or $actual -ne ($line -split '\s+')[0]) { throw "Checksum mismatch: $($pair[1])" }
          }
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          New-Item -ItemType Directory -Force "$env:APPDATA/Godot/export_templates/4.7.2.stable" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" "$env:APPDATA/Godot/export_templates/4.7.2.stable/"
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV
      - name: Validate baseline, rules, physics and impaired four-peer networking
        shell: pwsh
        run: ./tools/check-mvp.ps1 -GodotPath $env:GODOT
      - name: Export client and server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force battlebots/exports/windows,battlebots/exports/linux | Out-Null
          & $env:GODOT --headless --path battlebots --export-release 'Windows Client'
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed' }
          & $env:GODOT --headless --path battlebots --export-release 'Linux Server'
          if ($LASTEXITCODE -ne 0) { throw 'Linux export failed' }
      - name: Check independent server and client processes
        shell: pwsh
        run: |
          ./tools/check-processes.ps1 -GodotPath $env:GODOT
          ./tools/check-processes.ps1 -GodotPath $env:GODOT -PlayerCount 10
      - uses: actions/upload-artifact@v4
        with:
          name: battlebots-mvp-${{ github.sha }}
          path: battlebots/exports/
