name: Godot MVP checks and builds
on:
  push:
    branches: [main, 'codex/a-*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and export templates
        shell: pwsh
        run: |
          $release = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          Invoke-WebRequest "$release/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Invoke-WebRequest "$release/Godot_v4.7.2-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          Invoke-WebRequest "$release/SHA512-SUMS.txt" -OutFile "$env:RUNNER_TEMP/sums.txt"
          foreach ($pair in @(@('godot.zip','Godot_v4.7.2-stable_win64.exe.zip'), @('templates.zip','Godot_v4.7.2-stable_export_templates.tpz'))) {
            $actual = (Get-FileHash "$env:RUNNER_TEMP/$($pair[0])" -Algorithm SHA512).Hash.ToLower()
            $line = Get-Content "$env:RUNNER_TEMP/sums.txt" | Where-Object { $_.EndsWith($pair[1]) }
            if (-not $line -or $actual -ne ($line -split '\s+')[0]) { throw "Checksum mismatch: $($pair[1])" }
          }
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          New-Item -ItemType Directory -Force "$env:APPDATA/Godot/export_templates/4.7.2.stable" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" "$env:APPDATA/Godot/export_templates/4.7.2.stable/"
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV
      - name: Validate baseline, rules, physics and impaired four-peer networking
        shell: pwsh
        run: ./tools/check-mvp.ps1 -GodotPath $env:GODOT
      - name: Check presentation and menu integration
        # Both developers' integration checks precede the exported playtest builds.
        shell: pwsh
        run: ./battlebots/tests/presentation/check-presentation.ps1 -GodotPath $env:GODOT
      - name: Check natural two-player combat and rematch
        shell: pwsh
        run: ./tools/check-gameplay.ps1 -GodotPath $env:GODOT
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check hosted matchmaking and assigned dedicated gameplay
        shell: pwsh
        run: |
          node --test services/matchmaking/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Matchmaking service tests failed' }
          node tools/check-hosted.mjs --godot $env:GODOT
          if ($LASTEXITCODE -ne 0) { throw 'Hosted end-to-end test failed' }
      - name: Validate merged Flamebot runtime art
        shell: pwsh
        run: |
          $artCheck = (Resolve-Path ./art_source/flamebot/check_flamebot.gd).Path
          $artOutput = & $env:GODOT --headless --path battlebots --script $artCheck --quit-after 120 2>&1
          $artExit = $LASTEXITCODE
          $artOutput | ForEach-Object { Write-Host $_ }
          if ($artExit -ne 0 -or ($artOutput -match 'SCRIPT ERROR:|^ERROR:') -or -not ($artOutput -match 'FLAMEBOT CHECK PASSED:')) { throw 'Flamebot check failed' }
      - name: Export client and server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force battlebots/exports/windows,battlebots/exports/linux | Out-Null
          & $env:GODOT --headless --path battlebots --export-release 'Windows Client'
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed' }
          & $env:GODOT --headless --path battlebots --export-release 'Linux Server'
          if ($LASTEXITCODE -ne 0) { throw 'Linux export failed' }
      - name: Check independent server and client processes
        shell: pwsh
        run: |
          $client = (Resolve-Path ./battlebots/exports/windows/battlebots.exe).Path
          ./tools/check-processes.ps1 -GodotPath $client -Exported
          ./tools/check-processes.ps1 -GodotPath $client -PlayerCount 10 -Exported
          ./tools/check-processes.ps1 -GodotPath $client -Mode ffa -Exported
          node tools/check-hosted.mjs --godot $env:GODOT --server-binary $client
          if ($LASTEXITCODE -ne 0) { throw 'Exported hosted-server test failed' }
      - name: Record native Godot failures
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Godot|battlebots' } |
            Select-Object TimeCreated, Message | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: battlebots-mvp-${{ github.sha }}
          path: battlebots/exports/
